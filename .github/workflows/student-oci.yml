name: Student OCI

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "compose.yaml"
      - "container/**"
      - "tests/smoke/**"
      - ".github/workflows/student-oci.yml"
  pull_request:
    paths:
      - "Containerfile"
      - "compose.yaml"
      - "container/**"
      - "tests/smoke/**"
      - ".github/workflows/student-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-oci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout course
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build student OCI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: eduamigac-game:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests
        run: |
          docker run --rm \
            -v "$PWD:/source:ro" \
            eduamigac-game:ci \
            sh -c 'cp -a /source/. /workspace/ && sh tests/smoke/run.sh'
