# Dependency lock

# This file is the human-readable source of truth for student OCI dependencies.
# Release builds must replace unresolved values before publication.

[base]
distribution = "debian"
release = "bookworm"
variant = "slim"

[toolchain]
name = "m68k-amigaos-gcc"
family = "Bebbo GCC"
# Maintained source/mirror selection and immutable revision are validated before M1.
source = "https://github.com/AmigaPorts/m68k-amigaos-gcc.git"
revision = "b58d16de6b9ca921825b8a1f1783a64224ad6cf4"
prefix = "/opt/amiga"

[cmake_toolchains]
source = "https://github.com/AmigaPorts/AmigaCMakeCrossToolchains.git"
revision = "c579e46732af7398a09360dce4a6fb8d91d3f447"
install_prefix = "/opt/course/deps/cmake-toolchains"

[ace]
source = "https://github.com/AmigaPorts/ACE.git"
revision = "9e6ce064897cbd6b517d56fbd15da43919261a56"
install_prefix = "/opt/course/deps/ace"

[sevgi]
source = "https://github.com/alpyre/Sevgi_Engine.git"
revision = "fcf1b2166351911d49baa6641cf7a359075721a2"
branch = "master"
install_prefix = "/opt/course/deps/sevgi"

[policy]
moving_branches_allowed_in_release = false
student_requires_ploos_infrastructure = false
